<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustAxis Policy — Trust Today, Secure Tomorrow</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#071A3D;--d:#041126;--o:#F28C28;--g:#F5B942;--bg:#F5F7FA;--t:#1c2740;--m:#5c6884;--l:#dfe5ee}
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;color:var(--n);line-height:1.15}
a{color:inherit;text-decoration:none}

.w{max-width:1120px;margin:auto;padding:0 20px}
.sec{padding:56px 0}
nav{position:sticky;top:0;z-index:20;background:var(--d);color:#fff}

#burger{display:none;margin-left:auto;background:none;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px}
@media(max-width:900px){#burger{display:block}.links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--d);padding:10px 20px 16px;flex-direction:column;align-items:stretch}.links.open{display:flex}}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;border:0;background:var(--o);color:#fff;font:600 15px Outfit,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn.s{background:var(--n)}.btn.g{background:none;border:1.5px solid currentColor;color:var(--n)}.btn.sm{padding:7px 13px;font-size:13px}

ul.t{padding-left:18px;margin:10px 0;color:var(--m);font-size:14px}

.mod{position:fixed;inset:0;background:#041126cc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}

label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:var(--n)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--l);border-radius:9px;font:inherit;background:#fff}

table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--l)}th{color:var(--m);font-weight:600}
.tw{overflow-x:auto}
.st{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.Approved{background:#dff5e6;color:#17773a}.Pending{background:#fff3d6;color:#8a6200}.Rejected{background:#fde2e0;color:#a32a20}

footer{background:var(--d);color:#9fb0cf;padding:28px 0;font-size:14px;text-align:center}

.rc{background:#fff;width:210mm;min-height:297mm;margin:20px auto;padding:18mm;border:1px solid var(--l);position:relative}
.rc h1{font-size:26px}.stamp{position:absolute;right:18mm;bottom:30mm;border:3px double #17773a;color:#17773a;padding:10px 16px;transform:rotate(-8deg);font-weight:700;text-align:center}
@media(max-width:820px){.rc{width:auto;min-height:0;padding:20px}}
@media print{nav,footer,.np,#toast{display:none!important}body{background:#fff}.rc{margin:0;border:0;width:auto}@page{size:A4;margin:0}}
</style></head><body>
<nav class="np"><div class="w"><a href="#/" class="logo"><img id="lg" src="logo.svg" alt="TrustAxis logo"><span>TrustAxis<small>TRUST TODAY • SECURE TOMORROW</small></span></a><button id="burger" aria-label="Menu">☰</button><div class="links" id="links"></div></div></nav>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=JSON.parse(localStorage.getItem('tx')||'null')||{users:[{id:'u0',name:'Admin',email:'admin@trustaxis.com',phone:'',pw:btoa('Admin@123'),role:'admin'}],apps:[],sess:null};
const save=()=>localStorage.setItem('tx',JSON.stringify(db)),me=()=>db.users.find(u=>u.id===db.sess),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const C={Health:'🩺',Vehicle:'🚗',Property:'🏠',Life:'🛡️'};
const S=[
['h1','Health','TrustHealth Secure',500000,6200,['Cashless at 5,000+ hospitals','Pre/post hospitalisation cover','No claim bonus 10%'],'Individual health cover for hospital stays, day-care procedures and ambulance charges.'],
['h2','Health','Family Health Plus',1000000,14500,['Floater for up to 5 members','Maternity & newborn cover','Free yearly health check-up'],'One sum insured shared by the whole family, including maternity benefits.'],
['v1','Vehicle','TrustDrive Protect',300000,3800,['Third-party liability','Own-damage cover','24x7 roadside help'],'Essential motor cover for cars and bikes against accidents, theft and third-party claims.'],
['v2','Vehicle','Auto Secure Plus',800000,7400,['Zero depreciation','Engine protection','Return-to-invoice'],'Comprehensive add-on-rich cover for newer vehicles.'],
['p1','Property','TrustHome Shield',2500000,4200,['Fire, flood & earthquake','Burglary cover','Appliance protection'],'Protects your home structure and contents from damage and loss.'],
['p2','Property','Property Secure Plus',7500000,9800,['Covers shops & offices','Loss-of-rent cover','Public liability'],'Higher-limit cover for commercial and rental property.'],
['l1','Life','TrustLife Secure',5000000,8600,['Pure term protection','Terminal illness benefit','Tax benefits'],'Affordable term cover that pays your nominee a lump sum.'],
['l2','Life','Family Life Protection',10000000,15200,['Income replacement payout','Accidental death rider','Waiver of premium'],'Large-cover plan designed to keep your family\'s finances steady.']
].map(a=>({id:a[0],cat:a[1],name:a[2],cover:a[3],price:a[4],hl:a[5],desc:a[6]}));
const DUR={1:0,3:.05,5:.1};
const OFF0=[
{c:'WELCOME10',t:'10% off your first policy',d:'Valid on every scheme. Applied after the term discount.',pct:10},
{c:'FAMILY15',t:'15% off family plans',d:'For Family Health Plus and Family Life Protection.',pct:15,ids:['h2','l2']},
{c:'SAFEDRIVE8',t:'8% off vehicle insurance',d:'For TrustDrive Protect and Auto Secure Plus.',pct:8,cat:'Vehicle'},
{c:'HOME500',t:'₹500 off property cover',d:'Flat discount on TrustHome Shield and Property Secure Plus.',flat:500,cat:'Property'}];
let OFF=JSON.parse(localStorage.getItem('txo')||'null')||OFF0;const saveO=()=>localStorage.setItem('txo',JSON.stringify(OFF)),act=()=>OFF.filter(o=>o.on!==false);
const cpn=(c,s,k)=>{const o=OFF.find(x=>x.c==String(c||'').trim().toUpperCase());return o&&(o.on!==false||k)&&(!o.ids||o.ids.includes(s.id))&&(!o.cat||o.cat==s.cat)?o:null};
const calc=(s,y,code)=>{const base=s.price*y,disc=base*DUR[y],after=base-disc,o=code&&cpn(code,s,1),cd=o?Math.min(after,o.pct?after*o.pct/100:o.flat):0,net=after-cd,gst=net*.18;return{base,disc,cd,net,gst,total:net+gst}};
const FQ={Yearly:1,Quarterly:4,Monthly:12},inst=(c,f,y)=>{const n=y*(FQ[f]||1);return{n,amt:c.total/n}};
const offCard=o=>`<div class="card" style="border-left:5px solid var(--g)"><span class="pill">${o.cat||(o.ids?'Family plans':'All schemes')}</span><h3 style="margin:10px 0 4px">${o.t}</h3><p style="color:var(--m);font-size:14px">${o.d}</p><div style="margin:12px 0;padding:8px 12px;border:2px dashed var(--o);border-radius:9px;font-weight:700;letter-spacing:.08em;text-align:center">${o.c}</div><div style="display:flex;gap:8px"><button class="btn g sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${o.c}');toast('Code ${o.c} copied')">Copy code</button><button class="btn sm" onclick="claim('${o.c}')">Claim offer</button></div></div>`;
function claim(c){sessionStorage.cp=c;const o=OFF.find(x=>x.c==c);location.hash='#/schemes'+(o.cat?'?cat='+o.cat:'');toast('Pick a scheme — code '+c+' will be filled in')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2800)}
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function nav(){const u=me(),p=location.hash.slice(1)||'/';const L=[['/','Home'],['/policies','Policies'],['/schemes','Schemes'],['/offers','Offers'],['/how','How It Works'],['/about','About Us'],['/contact','Contact']];
let h=L.map(([a,b])=>`<a href="#${a}" class="${p.split('?')[0]==a?'on':''}">${b}</a>`).join('');
h+=u?`<a href="#/${u.role=='admin'?'admin':'dashboard'}">${u.role=='admin'?'Admin':'Dashboard'}</a><button onclick="out()">Logout (${esc(u.name.split(' ')[0])})</button>`:`<a href="#/login">Login</a><a href="#/register" class="cta">Register</a>`;
$('#links').innerHTML=h;$('#links').classList.remove('open')}
function out(){db.sess=null;save();toast('Logged out');location.hash='#/'}
$('#burger').onclick=()=>$('#links').classList.toggle('open');
$('#lg').onerror=function(){this.onerror=null;this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#F28C28"/><text x="32" y="43" font-size="30" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">TA</text></svg>')};
function card(s){return`<div class="card"><span class="pill">${C[s.cat]} ${s.cat}</span><h3 style="margin:10px 0 4px">${s.name}</h3><p style="color:var(--m);font-size:14px">Cover up to <b>${inr(s.cover)}</b></p><ul class="t">${s.hl.map(x=>'<li>'+x+'</li>').join('')}</ul><p style="font-size:13px;color:var(--m)">Duration: 1, 3 or 5 years</p><div class="price">${inr(s.price)}<small style="font:14px Outfit;color:var(--m)"> /year</small></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn g sm" onclick="detail('${s.id}')">Details</button><button class="btn sm" onclick="apply('${s.id}')">Apply Now</button></div></div>`}
function detail(id){const s=S.find(x=>x.id==id),m=modal(`<h2>${s.name}</h2><p class="pill" style="margin:8px 0">${s.cat}</p><p>${s.desc}</p><ul class="t">${s.hl.map(x=>'<li>'+x+'</li>').join('')}</ul><table><tr><th>Duration</th><th>Discount</th><th>Total (incl. GST)</th></tr>${[1,3,5].map(y=>`<tr><td>${y} yr</td><td>${DUR[y]*100}%</td><td>${inr(calc(s,y).total)}</td></tr>`).join('')}</table><div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="this.closest('.mod').remove();apply('${id}')">Apply Now</button><button class="btn g" onclick="this.closest('.mod').remove()">Close</button></div>`)}
function apply(id){location.hash='#/apply?s='+id}
const R={};
R['/']=()=>`<section class="hero"><div class="w"><div class="tag">TRUST TODAY • SECURE TOMORROW</div><h1>Insurance that is clear, quick and on your side.</h1><p>Compare plans, apply online in minutes and track every policy from one dashboard.</p><a class="btn" href="#/schemes">Explore schemes</a> <a class="btn g" href="#/${me()?'dashboard':'register'}">${me()?'Go to dashboard':'Create free account'}</a></div></section>
<section class="sec"><div class="w"><h2>Choose what you want to protect</h2><div class="grid" style="margin-top:20px">${Object.keys(C).map(c=>`<div class="card cat" tabindex="0" role="button" onclick="location.hash='#/schemes?cat=${c}'" onkeydown="if(event.key=='Enter')this.click()"><div class="i">${C[c]}</div><h3>${c} Insurance</h3><p style="color:var(--m);font-size:14px">${S.filter(s=>s.cat==c).length} plans from ${inr(Math.min(...S.filter(s=>s.cat==c).map(s=>s.price)))}/year</p></div>`).join('')}</div></div></section>
<section class="sec" style="padding-top:0"><div class="w"><h2>Current offers</h2><div class="grid" style="margin-top:20px">${act().slice(0,3).map(offCard).join('')}</div><p style="margin-top:16px"><a class="btn g" href="#/offers">See all offers</a></p></div></section>
<section class="stats sec"><div class="w grid"><div><b>2.4M+</b>Lives protected</div><div><b>98%</b>Claims settled</div><div><b>₹1,200 Cr</b>Claims paid</div><div><b>24x7</b>Customer support</div></div></section>
<section class="sec"><div class="w"><h2>Why customers trust us</h2><div class="grid" style="margin-top:20px">${[['🔒','Encrypted data','Your details stay private and protected.'],['💰','No hidden charges','See the full price breakdown before you apply.'],['⚡','Quick approval','Most applications reviewed within 24 hours.'],['🤝','Real support','Talk to a person, any time of day.']].map(x=>`<div class="card"><div style="font-size:28px">${x[0]}</div><h3 style="font-size:18px;margin:6px 0">${x[1]}</h3><p style="color:var(--m);font-size:14px">${x[2]}</p></div>`).join('')}</div></div></section>`;
R['/policies']=R['/schemes']=q=>{const c=q.get('cat')||'All',list=S.filter(s=>c=='All'||s.cat==c);return`<div class="w sec"><h2>Insurance schemes</h2><div class="fil">${['All',...Object.keys(C)].map(x=>`<button class="${x==c?'on':''}" onclick="location.hash='#/schemes${x=='All'?'':'?cat='+x}'">${x}</button>`).join('')}</div><div class="grid">${list.map(card).join('')}</div></div>`};
R['/offers']=()=>`<div class="w sec"><h2>Offers and discounts</h2><p style="color:var(--m);margin:8px 0 20px">Enter a code in step 2 of the application, or tap Claim offer to fill it in for you.</p><div class="grid">${act().map(offCard).join('')||'<p>No offers right now. Check back soon.</p>'}</div></div>`;
R['/how']=()=>`<div class="w sec"><h2>How it works</h2><div class="grid flow" style="margin-top:20px;grid-template-columns:1fr">${[['Create your account','Register with your name, email and phone.'],['Pick a scheme','Filter by health, vehicle, property or life and compare.'],['Fill the application','Five short steps: your details, plan, nominee, declarations and review.'],['We review it','Our team approves or asks for changes. Track status on your dashboard.'],['Get your receipt','Print or download your policy receipt anytime.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="color:var(--m)">${x[1]}</p></div>`).join('')}</div><p style="margin-top:20px"><a class="btn" href="#/schemes">Start now</a></p></div>`;
R['/about']=()=>`<div class="w sec"><h2>About TrustAxis</h2><p style="max-width:44em;margin:14px 0 24px;color:var(--m)">Our mission is to make insurance simple to understand and easy to buy, so every family can plan with confidence.</p><div class="grid">${[['Transparency','Every charge shown before you pay.'],['Care','Claims and support handled by people who listen.'],['Speed','Digital from application to receipt.'],['Integrity','We say what is covered, and what is not.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="color:var(--m)">${x[1]}</p></div>`).join('')}</div></div>`;
R['/contact']=()=>`<div class="w"><div class="card box"><h2>Contact us</h2><form onsubmit="return contact(event)" novalidate><label>Name</label><input name="n"><label>Email</label><input name="e" type="email"><label>Message</label><textarea name="m" rows="4"></textarea><div class="err" id="er"></div><br><button class="btn">Send message</button></form></div></div>`;
function contact(e){e.preventDefault();const f=e.target;if(!f.n.value.trim()||!/^\S+@\S+\.\S+$/.test(f.e.value)||f.m.value.trim().length<5){$('#er').textContent='Enter your name, a valid email and a message of at least 5 characters.';return false}
const m=JSON.parse(localStorage.getItem('txm')||'[]');m.push({n:f.n.value,e:f.e.value,m:f.m.value,t:Date.now()});localStorage.setItem('txm',JSON.stringify(m));f.reset();$('#er').textContent='';toast('Message sent. We will reply within 1 working day.');return false}
R['/login']=()=>`<div class="w"><div class="card box"><h2>Login</h2><form onsubmit="return login(event)" novalidate><label>Email</label><input name="e" type="email" autocomplete="email"><label>Password</label><input name="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><br><button class="btn">Login</button> <a href="#/register" style="margin-left:10px;color:var(--o)">Create account</a></form><p style="font-size:12px;color:var(--m);margin-top:14px">Admin demo: admin@trustaxis.com / Admin@123</p></div></div>`;
function login(e){e.preventDefault();const f=e.target,u=db.users.find(x=>x.email==f.e.value.trim().toLowerCase()&&x.pw==btoa(f.p.value));if(!u){$('#er').textContent='Email or password is incorrect.';return false}db.sess=u.id;save();toast('Welcome back, '+u.name.split(' ')[0]);location.hash=u.role=='admin'?'#/admin':(sessionStorage.nx||'#/dashboard');sessionStorage.removeItem('nx');return false}
R['/register']=()=>`<div class="w"><div class="card box"><h2>Create account</h2><form onsubmit="return reg(event)" novalidate><label>Full name</label><input name="n"><label>Email</label><input name="e" type="email"><label>Phone (10 digits)</label><input name="ph" inputmode="numeric"><label>Password (8+ chars, a letter and a number)</label><input name="p" type="password"><label>Confirm password</label><input name="c" type="password"><div class="err" id="er"></div><br><button class="btn">Register</button></form></div></div>`;
function reg(e){e.preventDefault();const f=e.target,em=f.e.value.trim().toLowerCase();let x='';
if(f.n.value.trim().length<3)x='Enter your full name.';else if(!/^\S+@\S+\.\S+$/.test(em))x='Enter a valid email.';else if(!/^[6-9]\d{9}$/.test(f.ph.value))x='Enter a valid 10-digit mobile number.';else if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.p.value))x='Password needs 8+ characters with a letter and a number.';else if(f.p.value!=f.c.value)x='Passwords do not match.';else if(db.users.some(u=>u.email==em))x='This email is already registered. Try logging in.';
$('#er').textContent=x;if(x)return false;const u={id:'u'+Date.now(),name:f.n.value.trim(),email:em,phone:f.ph.value,pw:btoa(f.p.value),role:'user'};db.users.push(u);db.sess=u.id;save();toast('Account created');location.hash=sessionStorage.nx||'#/dashboard';sessionStorage.removeItem('nx');return false}
let F={},step=0;
const STEPS=['Applicant','Scheme','Nominee','Declarations','Review'];
R['/apply']=q=>{if(!me()){sessionStorage.nx=location.hash;toast('Please login to apply');location.hash='#/login';return''}
if(q.get('s')&&F._s!=q.get('s')){F={s:q.get('s'),y:'1',fq:'Yearly',_s:q.get('s'),name:me().name,email:me().email,phone:me().phone,cp:sessionStorage.cp||''};sessionStorage.removeItem('cp');step=0}
const v=k=>esc(F[k]||''),i=(k,l,t='text',x='')=>`<label>${l}</label><input data-f="${k}" type="${t}" value="${v(k)}" ${x}>`;let b='';
